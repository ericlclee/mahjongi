# Deploy on Fly.io: `fly launch --copy-config --no-deploy`, then `fly deploy`.
# Games live in memory, so keep exactly one machine running.
app = "mahjongi"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
