[package]
name = "mahjongi-server"
description = "Multiplayer WebSocket server and static host for the web client"
edition.workspace = true
version.workspace = true

[dependencies]
mahjongi-engine = { path = "../engine" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
tokio-tungstenite = "0.26"
